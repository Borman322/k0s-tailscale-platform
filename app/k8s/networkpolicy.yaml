# Входящий трафик в namespace закрыт по умолчанию; открыто только нужное.
# Исходящий не ограничен: collector ходит в API систем найма.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# К Postgres — только collector и Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-from-apps
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [collector, grafana]}
      ports:
        - {protocol: TCP, port: 5432}
---
# К Grafana — только прокси Tailscale-оператора (namespace tailscale).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-tailscale
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 3000}
