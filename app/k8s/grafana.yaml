# Grafana. Дашборд и источник данных — из provisioning (ConfigMap), состояние
# (grafana.db: пользователи, правки из UI) — на томе, перенесённом из compose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate                     # том RWO: два пода сразу не поднять
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472                 # пользователь grafana в образе
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            # Адрес собирается из настроек установки (ConfigMap jobmon-settings из overlay).
            - name: GRAFANA_HOST
              valueFrom:
                configMapKeyRef: {name: jobmon-settings, key: GRAFANA_HOST}
            - name: TAILNET_DOMAIN
              valueFrom:
                configMapKeyRef: {name: jobmon-settings, key: TAILNET_DOMAIN}
            - name: GF_SERVER_ROOT_URL
              value: https://$(GRAFANA_HOST).$(TAILNET_DOMAIN)/
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: jobmon, key: GRAFANA_PASSWORD}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: PG_PASSWORD              # подставляется в datasources/postgres.yml
              valueFrom:
                secretKeyRef: {name: jobmon, key: DB_PASSWORD}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
