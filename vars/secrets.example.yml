---
# Copy to vars/secrets.yml: `make init` does it and fills in random jobmon passwords.
# Never commit the real file: GitHub secret scanning reports Tailscale keys to
# Tailscale, which revokes them at once.

# Reusable, pre-approved auth key: admin console → Settings → Keys.
tailscale_authkey: ""

# OAuth client of the Kubernetes operator (admin console → Trust credentials;
# write on General/Services, Devices/Core, Keys/Auth Keys, tag:k8s-operator).
# Leave empty to skip the operator: Grafana then has no HTTPS address.
tailscale_operator_oauth_client_id: ""
tailscale_operator_oauth_client_secret: ""

# jobmon. Letters and digits only: the DB password goes into a DSN as is.
jobmon_db_password: ""
jobmon_grafana_password: ""

# Only if the ghcr package is private: a GitHub user and a token with read:packages.
ghcr_pull_user: ""
ghcr_pull_token: ""
