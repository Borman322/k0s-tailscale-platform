# Copy to inventory.ini (`make init`). Ansible reaches the hosts over SSH by public IP,
# so the machine running it does not need to be in the tailnet.
# Inventory names become Tailscale machine names.

[first_controller]
cp-01 ansible_host=203.0.113.10 ansible_user=root

[new_workers]
worker-01 ansible_host=203.0.113.11 ansible_user=root
# A host that only accepts SSH from the controller:
# worker-02 ansible_host=203.0.113.12 ansible_user=root ansible_ssh_common_args='-J root@203.0.113.10'
