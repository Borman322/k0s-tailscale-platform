# Builds app/collector and pushes it to ghcr.io/<owner>/<repo>-collector
# with tags sha-<short commit> (use this one in jobmon_collector_image) and latest.
name: collector-image

on:
  push:
    branches: [main]
    paths:
      - app/collector/**
      - .github/workflows/collector-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # named after the repository, so forks and copies never collide
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-collector
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: app/collector
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag to put into group_vars/all.yml
        run: echo "jobmon_collector_image ← $(echo '${{ steps.meta.outputs.tags }}' | grep sha- | head -1)" >> "$GITHUB_STEP_SUMMARY"
